<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0620">
  <title>A birthday surprise 🎁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
:root{
  --gold:#f6b94c; --btn1:#ff8a5c; --btn2:#f7a76b; --pink:#e0357a;
  --bg1:#3a0f3f; --bg2:#1a0620; --glow:#a8326a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:linear-gradient(160deg,#d9e8f7,#f3e6f0);
  font-family:'Fredoka',system-ui,sans-serif;color:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#12041a;isolation:isolate;user-select:none}
@media(min-width:600px){
  #app{width:400px;height:min(860px,94vh);border-radius:38px;border:9px solid #0b0b0f;box-shadow:0 30px 80px rgba(60,20,80,.35)}
}

/* ---------- backgrounds ---------- */
.bg{position:absolute;inset:0;transition:opacity .8s;z-index:-2;overflow:hidden}
#bg-dark{background:radial-gradient(120% 70% at 50% 112%,var(--glow),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2))}
#bg-light{background:linear-gradient(180deg,#fde6ee,#fff4ea);opacity:0}
#app.light #bg-light{opacity:1}
#app.light #bg-dark{opacity:0}
.float{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.55);animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-110vh);opacity:0}}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#sound{position:absolute;top:14px;right:14px;z-index:30;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}
#app.light #sound{background:rgba(224,53,122,.12)}

/* ---------- screens ---------- */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:56px 20px 28px;text-align:center;overflow-y:auto;overflow-x:hidden;
  opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s;
}
.screen.active{opacity:1;visibility:visible;transition:opacity .5s}
.title{font-size:22px;font-weight:600;letter-spacing:.2px}
.muted{color:rgba(255,255,255,.65);font-size:14px;line-height:1.4}
.muted.sm{font-size:12.5px}
.tiny{font-size:11.5px;color:rgba(255,255,255,.5)}
.gold{color:var(--gold)}
.big{font-size:20px;font-weight:600}
.script{font-family:'Caveat',cursive;font-size:22px;font-weight:500}

.btn{
  border:0;border-radius:999px;padding:15px 34px;font:600 18px 'Fredoka',sans-serif;color:#fff;cursor:pointer;
  background:linear-gradient(90deg,var(--btn1),var(--btn2));box-shadow:0 8px 24px rgba(255,138,92,.35);
  transition:transform .15s;
}
.btn:active{transform:scale(.96)}
.btn.wide{width:100%;max-width:320px}
.btn.small{padding:10px 22px;font-size:15px;background:rgba(255,255,255,.14);box-shadow:none}

/* ---------- 1. gate ---------- */
.gate-card{
  width:100%;max-width:330px;padding:26px 20px;border-radius:22px;border:1.5px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px;
}
.gift-box{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:32px;animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(8deg)}30%{transform:rotate(0)}}
.label{font-size:11px;letter-spacing:2.5px;color:rgba(255,255,255,.6);margin-top:8px}
.name{font-size:36px;font-weight:600;line-height:1.1}

/* ---------- 2. wish ---------- */
.wish-card{
  position:relative;width:100%;aspect-ratio:3/4;max-height:78%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(90% 60% at 50% 40%,#e8156f,#a50a54);box-shadow:0 0 60px rgba(255,60,140,.45);animation:fadeUp .8s both;
}
.wish-card h1{font-size:50px;line-height:1.02;font-weight:700;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.wish-card .script{color:rgba(255,255,255,.8);font-size:19px}
.wish-card .sm{font-size:16px}
.swoosh{width:90px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffd37a,transparent)}
.spark{position:absolute;width:14px;height:14px;border-radius:50%;background:#ffe2a8;box-shadow:0 0 18px 8px rgba(255,220,150,.8);animation:sparkMove 3.2s ease-in-out infinite}
@keyframes sparkMove{0%{left:30%;top:42%}50%{left:62%;top:46%}100%{left:30%;top:42%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- 3. cake ---------- */
.cake-wrap{display:flex;flex-direction:column;align-items:center;margin-top:20px}
.cake{position:relative;display:flex;flex-direction:column;align-items:center}
.tier{position:relative;transform:scaleY(0);transform-origin:bottom;transition:transform .9s cubic-bezier(.3,1.4,.5,1);
  background:linear-gradient(#f88fb3,#e5668f);border-radius:8px 8px 4px 4px}
.tier::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:#ffd1e1;border-radius:8px 8px 12px 12px}
.t1{width:170px;height:48px}.t2{width:122px;height:40px}
.build .t1{transform:scaleY(1);transition-delay:.3s}
.build .t2{transform:scaleY(1);transition-delay:1.1s}
.candle{position:relative;width:7px;height:34px;background:repeating-linear-gradient(135deg,#fff,#fff 5px,#ffc4d8 5px,#ffc4d8 10px);border-radius:3px;opacity:0;transition:opacity .4s 1.9s}
.build .candle{opacity:1}
.flame{position:absolute;left:50%;top:-20px;width:12px;height:19px;margin-left:-6px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
  background:radial-gradient(#fff6c0,#ffb02e 60%,#ff7a1a);box-shadow:0 0 18px 6px rgba(255,170,60,.7);opacity:0;transform-origin:bottom;animation:flicker .35s ease-in-out infinite alternate}
.lit .flame{opacity:1}
@keyframes flicker{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
.plate{width:215px;height:6px;border-radius:4px;background:#f1f1f1;margin-top:-1px}
.cake-text{min-height:90px;display:flex;flex-direction:column;gap:8px}

/* ---------- 4. balloons ---------- */
#s-balloons{justify-content:flex-start;gap:10px}
.reasons{width:100%;display:flex;flex-direction:column;gap:9px;margin:4px 0}
.reason{
  position:relative;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;
  padding:10px 38px 10px 14px;min-height:60px;border-radius:14px;border:1.5px solid var(--c);
  background:rgba(255,255,255,.04);color:#fff;font:inherit;cursor:pointer;transition:transform .2s,background .3s;
}
.reason:active{transform:scale(.97)}
.badge{font-size:10px;font-weight:600;letter-spacing:1px;padding:3px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 25%,#2a0f2e)}
.rtext{font-size:15px;font-weight:500;line-height:1.3}
.rtext .real{display:none}
.pop-hint{font-weight:400;color:rgba(255,255,255,.5);font-size:13px;animation:pulse 1.6s ease-in-out infinite}
.popped{background:rgba(255,255,255,.08)}
.popped .real{display:block;animation:rise .5s both}
.popped .pop-hint{display:none}
.sp{position:absolute;right:12px;top:50%;margin-top:-10px;opacity:0;transition:opacity .4s}
.popped .sp{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
.outro,.after{opacity:0;transform:translateY(8px);transition:all .6s;pointer-events:none}
.outro.show,.after.show{opacity:1;transform:none;pointer-events:auto}

/* ---------- 5. memories ---------- */
#s-memories{justify-content:center;padding-top:70px}
.lights{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:space-around;padding:0 6px}
.lights::before{content:'';position:absolute;left:0;right:0;top:3px;height:1px;background:rgba(255,255,255,.18)}
.lights i{width:7px;height:7px;border-radius:50%;background:#ffd98a;box-shadow:0 0 10px 3px rgba(255,200,90,.7);animation:twinkle 2s ease-in-out infinite}
.lights i:nth-child(odd){animation-delay:.8s}.lights i:nth-child(3n){animation-delay:1.4s}
@keyframes twinkle{50%{opacity:.35}}
.track{
  width:calc(100% + 40px);display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px 19% 20px;scrollbar-width:none;cursor:grab;
}
.track::-webkit-scrollbar{display:none}
.polaroid{
  flex:0 0 64%;scroll-snap-align:center;background:#fff;color:#3a2a2a;padding:10px 10px 12px;border-radius:4px;
  transform:rotate(var(--r));box-shadow:0 12px 28px rgba(0,0,0,.45);position:relative;
}
.clip{position:absolute;top:-12px;left:50%;margin-left:-7px;width:14px;height:28px;border-radius:3px;background:#c9a26b;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.ph{position:relative;aspect-ratio:4/5;background:linear-gradient(135deg,#f9c5d1,#c9b6ff);overflow:hidden;display:grid;place-items:center;font-size:44px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.polaroid figcaption{font-family:'Caveat',cursive;font-size:22px;margin-top:8px}
.dots{display:flex;gap:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .3s}
.dots i.on{background:var(--gold);transform:scale(1.3)}

/* ---------- 6. letter ---------- */
.paper-wrap{position:relative;width:100%;height:70%;max-height:560px}
.paper{
  width:100%;height:100%;overflow-y:auto;text-align:left;padding:22px 20px 56px;border-radius:12px;color:#4a3a28;
  font-family:'Patrick Hand',cursive;font-size:19px;letter-spacing:.8px;line-height:28px;
  background:#f6ecd4 repeating-linear-gradient(transparent,transparent 27px,rgba(120,90,50,.13) 27px,rgba(120,90,50,.13) 28px);
  box-shadow:0 14px 34px rgba(0,0,0,.45);animation:fadeUp .8s both;
}
.paper .to{font-weight:700;margin-bottom:6px}
.paper .body{white-space:pre-wrap;word-break:break-word}
.paper .body.typing::after{content:'|';margin-left:1px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.seal{
  position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:0;font-size:20px;cursor:pointer;
  background:linear-gradient(135deg,#ff8aa8,#e0457a);box-shadow:0 4px 12px rgba(224,69,122,.5)
}
.seal.ready{animation:beat 1.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.14)}}

/* ---------- 7. finale ---------- */
.fin-title{font-size:38px;line-height:1.1;font-weight:600;letter-spacing:1px}
.fin-name{font-size:42px;font-weight:600;color:var(--gold);line-height:1.1}
.fin-emoji{font-size:46px;margin:10px 0;animation:wobble 2s ease-in-out infinite}
.foot{max-width:280px}

/* ---------- 8. heart / pull & release ---------- */
#s-heart{color:#c2185b;justify-content:flex-start;padding-top:70px}
.pinkline{color:#d1467d;font-style:italic;font-size:19px}
.big-heart{width:170px;height:170px;margin-top:20px;filter:drop-shadow(0 12px 28px rgba(240,60,130,.5));animation:heartbeat 1.4s ease-in-out infinite;transition:transform .35s,opacity .35s}
.big-heart.gone{transform:scale(1.6);opacity:0;animation:none}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
.bow{position:absolute;left:50%;bottom:62px;width:210px;margin-left:-105px;overflow:visible;touch-action:none;cursor:grab}
.hint{position:absolute;bottom:26px;left:0;right:0;font-size:11px;letter-spacing:3px;color:#9a6a80}
.flyheart{position:absolute;font-size:20px;z-index:25;pointer-events:none;animation:fly 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--rot));opacity:0}}

/* ---------- 9. tree ---------- */
#s-tree{padding:0;justify-content:flex-start}
.rays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 38%,rgba(255,255,255,.55) 0 6deg,transparent 6deg 14deg);animation:spin 80s linear infinite;mask-image:radial-gradient(circle at 50% 38%,#000,transparent 62%);-webkit-mask-image:radial-gradient(circle at 50% 38%,#000,transparent 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
#tree{position:absolute;inset:0;width:100%;height:100%}
.tree-text{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 30px;text-align:left;background:linear-gradient(transparent,rgba(255,244,234,.92) 35%)}
.tree-text .script{color:#9a6a80;font-size:17px}
.tree-text h1{font-size:34px;line-height:1.05;font-weight:700;color:var(--pink);margin:4px 0}
.tree-text .it{font-style:italic;color:#8a6a78;font-size:14px}
.replay{position:absolute;top:14px;left:14px;z-index:5;border:0;border-radius:999px;padding:7px 13px;background:rgba(224,53,122,.13);color:#c2185b;font:500 13px 'Fredoka';cursor:pointer}

/* ---------- upload ---------- */
.upload-row{display:flex;gap:10px;align-items:center;justify-content:center}
.upload-btn{border:1.5px dashed rgba(255,255,255,.4);border-radius:999px;padding:9px 18px;font:500 13px 'Fredoka',sans-serif;color:#fff;background:rgba(255,255,255,.06);cursor:pointer}
.clear-btn{border:0;background:transparent;color:rgba(255,255,255,.6);font:500 12.5px 'Fredoka',sans-serif;text-decoration:underline;cursor:pointer}
.ph.empty{font-size:28px;color:rgba(255,255,255,.7);text-align:center;line-height:1.5}
.polaroid.placeholder{opacity:.6}
.cap-input{width:100%;margin-top:8px;border:0;border-bottom:1px solid rgba(0,0,0,.15);background:transparent;font-family:'Caveat',cursive;font-size:20px;color:#3a2a2a;text-align:center;padding:2px 0;user-select:text}
.cap-input:focus{outline:none;border-color:#e0357a}
.remove-ph{position:absolute;top:-10px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:#2a0f2e;color:#fff;font-size:12px;cursor:pointer;z-index:2}

/* ---------- creator modal ---------- */
.modal{position:absolute;inset:0;z-index:40;background:rgba(18,4,26,.97);overflow-y:auto;padding:56px 20px 28px;display:flex;flex-direction:column;gap:12px;text-align:left;animation:fadeUp .4s both}
.modal .title{text-align:center}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:rgba(255,255,255,.7)}
.modal input,.modal textarea{width:100%;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font:15px 'Fredoka',sans-serif;padding:10px 12px;user-select:text;resize:vertical}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--gold)}
#cr-out{display:flex;flex-direction:column;gap:10px;align-items:center}
#cr-url{font-size:12px}
.modal .btn.wide{align-self:center}

#cr-out[hidden]{display:none}
.photo-box{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:rgba(255,255,255,.7)}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border:1.5px dashed rgba(255,255,255,.4);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;font:500 14px 'Fredoka',sans-serif;cursor:pointer;text-align:center}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:62px;height:62px;border-radius:10px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:10px;cursor:pointer}

</style>
</head>
<body>
  <div id="app">
    <div id="bg-dark" class="bg"></div>
    <div id="bg-light" class="bg"></div>
    <main id="screens"></main>
    <canvas id="fx"></canvas>
    <button id="sound" aria-label="Toggle sound">🔊</button>
  </div>
  <script>
/* =====================================================================
   🎁  EDIT EVERYTHING HERE  —  no need to touch any other file.
   Use {name}, {sender}, {age} anywhere in a text and they get replaced.
   You can also personalise a link without editing anything:
   https://yourname.github.io/birthday-surprise/?to=Riya&from=Sam&age=25
   ===================================================================== */
window.CONFIG = {

  siteTitle: "A surprise for {name} 🎁",

  recipient: "Ananya",     // the birthday person
  sender: "Bhargav",       // you
  age: 22,                 // the age they're turning

  /* ---------- Sound ---------- */
  sound: {
    enabled: true,         // false = starts muted
    music: "",             // e.g. "assets/music/song.mp3"  (leave "" for built-in chimes + birthday tune)
    volume: 0.5
  },

  /* ---------- Theme colours ---------- */
  theme: {
    gold: "#f6b94c",       // name + highlights
    buttonFrom: "#ff8a5c",
    buttonTo: "#f7a76b",
    bgTop: "#3a0f3f",      // dark screens background
    bgBottom: "#1a0620",
    glow: "#a8326a",
    pink: "#e0357a"        // last two screens
  },

  /* ---------- 1. Gift screen ---------- */
  gate: {
    label: "A SURPRISE FOR",
    subtitle: "{sender} made this — just for you.",
    button: "Unwrap it",
    hint: "Sound on for the full magic"
  },

  /* ---------- 2. Pink wish card (auto-continues) ---------- */
  wish: {
    small: "make a wish…",
    title: "Happy Birthday",
    footer: "to someone worth celebrating",
    seconds: 3.5
  },

  /* ---------- 3. Cake ---------- */
  cake: {
    intro: "First things first",
    baking: "Baking something sweet...",
    greeting: "Happy Birthday, {name}!",
    hint: "tap anywhere to continue"
  },

  /* ---------- 4. Pop the balloons (add or remove as many as you like) ---------- */
  balloons: {
    title: "Pop the balloons",
    subtitle: "{count} balloons. Each one holds a reason you're loved. Pop them all",
    reasons: [
      "Your laugh is my favourite sound ❤️",
      "You remember the little things I forget 🫶",
      "You believed in me when I didn't",
      "You make ordinary days feel special 🥹",
      "The world is kinder with you in it 🥺"
    ],
    outro: "...and a thousand more reasons 💛",
    button: "Keep going 💛"
  },

  /* ---------- 5. Memory lane (drop photos into assets/photos/) ---------- */
  memories: {
    title: "A walk down memory lane",
    hint: "swipe through, or add your own 📷",
    photos: [],   // optional starters; people can also add photos on the site
    button: "Keep going 💛"
  },

  /* ---------- 6. Letter (typed out letter-by-letter) ---------- */
  letter: {
    greeting: "Dear {name},",
    body:
`Every year I try to find the perfect words and every year I fall short, so here is the honest version 🫶

You make my most ordinary days feel worth remembering ❤️

Happy birthday, my favourite person 🥹

— {sender}`,
    speed: 38,             // milliseconds per letter (lower = faster)
    seal: "💗",            // the little button at the bottom-right
    hint: "tap the seal to continue"
  },

  /* ---------- 7. Big finale ---------- */
  finale: {
    title: "HAPPY BIRTHDAY",
    footer: "Made with 💛 just for you — {sender} 💛",
    next: "one more thing"
  },

  /* ---------- 8. Pull & release ---------- */
  heart: {
    label: "a little something, for you",
    hint: "PULL & RELEASE"
  },

  /* ---------- 9. Heart tree ---------- */
  tree: {
    small: "it's officially your day",
    title: "Happy Birthday, {name}",
    sub: "and just like that, you're turning {age} ✨"
  }
};


(() => {
  'use strict';
  const C = window.CONFIG;
  const q = new URLSearchParams(location.search);
  /* shared links carry the sender's choices in ?d=... */
  const enc = o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const dec = s => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))));
  let D = {};
  try { if (q.get('d')) D = dec(q.get('d')) || {}; } catch (e) { D = {}; }
  if (typeof D.letter === 'string' && D.letter.trim()) C.letter.body = D.letter.slice(0, 1500);
  if (Array.isArray(D.reasons) && D.reasons.length) C.balloons.reasons = D.reasons.slice(0, 8).map(r => String(r).slice(0, 90));
  const V = {
    name: D.to || q.get('to') || C.recipient,
    sender: D.from || q.get('from') || C.sender,
    age: D.age || q.get('age') || C.age,
    count: (C.balloons.reasons || []).length
  };
  const fmt = s => String(s ?? '')
    .replace(/\{name\}/g, V.name).replace(/\{sender\}/g, V.sender)
    .replace(/\{age\}/g, V.age).replace(/\{count\}/g, V.count);
  const esc = s => fmt(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const escRaw = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      band.setAttribute('points', `38,52 100,${REST} 162,52`);
      (function fly(now) {
        const t = Math.min(1, (now - t0) / dur);
        arrow.setAttribute('transform', `translate(0 ${y0 - dist * (t * t) - 0})`);
        if (t < 1) return requestAnimationFrame(fly);
        arrow.style.display = 'none'; hit();
      })(t0);
    };
    bow.addEventListener('pointerup', release);
    bow.addEventListener('pointercancel', release);
    function hit() {
      sfx.pop(); sfx.sparkle(); heart.classList.add('gone');
      const p = rel(heart);
      confetti({ x: p.x, y: p.y, count: 90, power: 11, colors: ['#ff4f93', '#ff8fab', '#ffb3cf', '#ffd166', '#fff'] });
      for (let i = 0; i < 18; i++) {
        const h = document.createElement('span'); h.className = 'flyheart'; h.textContent = ['💗', '💖', '💕', '🩷'][i % 4];
        const a = rand(0, 6.28), d = rand(70, 190);
        h.style.cssText = `left:${p.x}px;top:${p.y}px;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d - 40}px;--rot:${rand(-90, 90)}deg`;
        app.appendChild(h); setTimeout(() => h.remove(), 1200);
      }
      later(next, 1300);
    }
  };

  S.tree = el => {
    const t = C.tree;
    el.innerHTML = `
      <div class="rays"></div><canvas id="tree"></canvas>
      <button class="replay" id="replay">↻ replay</button>
      <div class="tree-text">
        <p class="script">${esc(t.small)}</p>
        <h1>${esc(t.title).replace(', ', ',<br>')}</h1>
        <p class="it">${esc(t.sub)}</p>
      </div>`;
    $('#replay', el).onclick = () => go('gate');
    growTree($('#tree', el), el);
    later(() => { sfx.chime(); rain(50); }, 2400);
  };

  /* ---------- heart tree (canvas) ---------- */
  function heartPath(ctx) {
    ctx.beginPath(); ctx.moveTo(0, 20);
    ctx.bezierCurveTo(-45, -8, -25, -40, 0, -16);
    ctx.bezierCurveTo(25, -40, 45, -8, 0, 20); ctx.closePath();
  }
  function growTree(cv, el) {
    const dpr = Math.min(devicePixelRatio || 1, 2), W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const cx = W / 2, baseY = H * .8, R = Math.min(W * .36, H * .22), crownY = H * .36;
    const cols = ['#ff5c8a', '#ff8fab', '#ffb347', '#ffd166', '#f06292', '#ff7043', '#ffa8c5'];
    const hs = [];
    while (hs.length < 240) {
      const x = rand(-1.25, 1.25), y = rand(-1.15, 1.3);
      if (Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y < 0) hs.push({ x: cx + x * R, y: crownY - y * R * .95, s: rand(.38, .7), c: cols[(Math.random() * cols.length) | 0], rot: rand(-.5, .5), ph: rand(0, 6.28) });
    }
    hs.sort((a, b) => b.y - a.y);
    hs.forEach((h, i) => h.d = 900 + i * 7);
    const P0 = [cx, baseY], P1 = [cx + W * .05, (baseY + crownY + R) / 2], P2 = [cx, crownY + R * .7];
    const bez = u => [(1 - u) ** 2 * P0[0] + 2 * (1 - u) * u * P1[0] + u * u * P2[0], (1 - u) ** 2 * P0[1] + 2 * (1 - u) * u * P1[1] + u * u * P2[1]];
    const start = performance.now();
    const ease = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
    (function frame(now) {
      if (!el.classList.contains('active') && now - start > 700) return;
      const t = now - start;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(224,53,122,.12)';
      ctx.beginPath(); ctx.ellipse(cx, baseY + 6, W * .26, 10, 0, 0, 6.28); ctx.fill();
      const g = Math.min(1, t / 1000);
      ctx.strokeStyle = '#8d5a3b'; ctx.lineCap = 'round';
      let prev = bez(0);
      for (let i = 1; i <= 40 * g; i++) {
        const u = i / 40, p = bez(u); ctx.lineWidth = 11 - 6 * u;
        ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); prev = p;
      }
      for (const h of hs) {
        const u = (t - h.d) / 380; if (u <= 0) continue;
        const s = ease(Math.min(1, u)) * h.s * (1 + Math.sin(t / 700 + h.ph) * .04);
        ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot + Math.sin(t / 1100 + h.ph) * .06); ctx.scale(s, s);
        heartPath(ctx); ctx.fillStyle = h.c; ctx.fill(); ctx.restore();
      }
      requestAnimationFrame(frame);
    })(start);
  }

  /* ---------- init ---------- */
  order.forEach(id => { const s = document.createElement('section'); s.className = 'screen'; s.id = 's-' + id; screensEl.appendChild(s); });
  sizeFx();
  go('gate');
})();

</script>
</body>
